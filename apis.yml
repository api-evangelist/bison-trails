name: Bison Trails
description: 'Bison Trails was a blockchain infrastructure company founded in 2018 by Joe Lallouz and
  Aaron Henshaw, offering infrastructure-as-a-service for participating in and securing proof-of-stake
  and other blockchain networks across dozens of protocols (staking, validators, and node infrastructure).
  Backed by Initialized Capital, Kleiner Perkins, and others, it was acquired by Coinbase in January 2021
  and folded into Coinbase Cloud. The bisontrails.co domain now redirects to Coinbase''s cloud/node
  infrastructure offering at coinbase.com/cloud, and no independent developer portal, documentation,
  or public API surface remains under the Bison Trails brand.'
